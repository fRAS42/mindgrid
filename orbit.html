<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0F2C">
<title>ORBIT · thoughts in orbit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/sql-wasm.js"></script>
<style>
:root{
  --void:#0A0F2C; --deep:#121A45; --plasma:#9B7BFF; --aurora:#6CFFC8; --solar:#FF7A6B; --gold:#FFD166;
  --ice:#E8F0FF; --slate:#8590C4; --glass:rgba(20,28,74,.66); --line:rgba(155,123,255,.30);
  --ui:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --display:'Unbounded','Space Grotesk',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--void);color:var(--ice);font-family:var(--ui);overflow:hidden;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#scene{touch-action:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--aurora);outline-offset:2px}
.glass{background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}

/* header */
#top{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 0;pointer-events:none}
#mark{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.3em;pointer-events:auto;display:flex;align-items:center;gap:2px}
#mark i{display:inline-block;width:.95em;height:.95em;border-radius:50%;border:2px solid var(--aurora);margin-right:.18em;
  box-shadow:0 0 10px rgba(108,255,200,.6),inset 0 0 6px rgba(108,255,200,.4)}
#status{margin-left:auto;pointer-events:auto;font-size:13px;color:var(--slate);padding:7px 12px;border-radius:999px;display:flex;align-items:center;gap:8px}
#status b{width:7px;height:7px;border-radius:50%;background:var(--aurora);box-shadow:0 0 8px var(--aurora)}
#status.dirty{color:var(--gold)}
#status.dirty b{background:var(--gold);box-shadow:0 0 8px var(--gold)}
#trail{order:3;flex-basis:100%;display:flex;flex-wrap:wrap;align-items:center;gap:2px;pointer-events:auto;min-height:26px}
#trail button{font-size:13px;color:var(--slate);padding:4px 9px;border-radius:999px}
#trail button:hover{color:var(--ice);background:rgba(155,123,255,.14)}
#trail .here{font-size:13px;color:var(--ice);padding:4px 9px}
#trail .sep{color:var(--slate);opacity:.45;font-size:12px}

/* file menu */
#filemenu{position:fixed;right:14px;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:12;border-radius:18px;padding:6px;min-width:210px;display:none}
#filemenu.show{display:block}
#filemenu button{display:block;width:100%;text-align:left;padding:11px 14px;border-radius:12px;font-size:15px}
#filemenu button:hover{background:rgba(155,123,255,.16)}
#filemenu small{display:block;color:var(--slate);font-size:12px;padding:6px 14px 4px}

/* info pills over the dock */
#info{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 74px);z-index:4;
  display:flex;flex-wrap:wrap;justify-content:center;gap:6px;width:min(560px,calc(100% - 24px));pointer-events:none}
#info span{font-size:12.5px;color:var(--slate);padding:4px 10px;border-radius:999px;border:1px solid rgba(133,144,196,.25);background:rgba(10,15,44,.5)}
#info .due-soon{color:var(--gold);border-color:rgba(255,209,102,.4)}
#info .due-now{color:var(--solar);border-color:rgba(255,122,107,.5)}

/* dock */
#dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:6;
  width:min(560px,calc(100% - 24px));display:flex;gap:8px;align-items:center}
#jumpWrap{flex:1;position:relative;min-width:0}
#jump{width:100%;font:inherit;font-size:16px;color:var(--ice);border-radius:999px;padding:13px 16px 13px 42px;outline:none;-webkit-user-select:text;user-select:text}
#jump::placeholder{color:var(--slate)}
#jumpWrap svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--slate);pointer-events:none;z-index:1}
#results{position:absolute;left:0;right:0;bottom:calc(100% + 8px);border-radius:20px;padding:6px;display:none;max-height:52vh;overflow:auto}
#results.show{display:block}
#results button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:14px;font-size:15px}
#results button small{display:block;color:var(--slate);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#results button.cur,#results button:hover{background:rgba(155,123,255,.18)}
#results mark{background:none;color:var(--aurora)}
#results .empty{padding:12px;color:var(--slate);font-size:14px}
.dockbtn{height:48px;min-width:48px;padding:0 16px;border-radius:999px;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px;flex:none}
#nowBtn em{font-style:normal;font-size:12px;min-width:20px;height:20px;line-height:20px;border-radius:10px;background:var(--solar);color:var(--void);font-weight:600;padding:0 5px}
#nowBtn em:empty{display:none}
#addBtn{background:linear-gradient(135deg,var(--plasma),var(--aurora));color:var(--void);font-weight:600;border:0;font-size:24px;padding:0;width:48px}

/* sheets (editor + now) */
.sheet{position:fixed;left:50%;bottom:0;z-index:14;width:min(560px,100%);transform:translate(-50%,110%);
  transition:transform .34s cubic-bezier(.2,.85,.2,1);background:rgba(16,22,62,.95);border:1px solid var(--line);border-bottom:0;
  border-radius:26px 26px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom,0px) + 18px);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 -20px 60px rgba(0,0,0,.45)}
.sheet.show{transform:translate(-50%,0)}
.grab{width:42px;height:5px;border-radius:3px;background:rgba(133,144,196,.4);margin:0 auto 12px}
.sheet h3{margin:0 0 12px;font-family:var(--display);font-weight:500;font-size:16px;letter-spacing:.02em}
#edText{width:100%;min-height:92px;max-height:34vh;resize:none;font:inherit;font-size:17px;line-height:1.45;color:var(--ice);
  background:rgba(10,15,44,.7);border:1px solid var(--line);border-radius:16px;padding:12px 14px;-webkit-user-select:text;user-select:text}
.row{display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.row > label,.row > .lbl{color:var(--slate);font-size:14px;min-width:70px}
.chip{min-width:42px;height:38px;border-radius:12px;border:1px solid var(--line);font-weight:600;font-size:15px;color:var(--slate)}
.chip.on{color:var(--void);border-color:transparent}
.chip[data-p="A"].on{background:var(--solar)} .chip[data-p="B"].on{background:var(--gold)}
.chip[data-p="C"].on{background:var(--aurora)} .chip[data-p="D"].on{background:var(--slate)}
.chip[data-p=""]{font-weight:400}
.chip[data-p=""].on{background:rgba(133,144,196,.25);color:var(--ice)}
#edDue{font:inherit;font-size:16px;color:var(--ice);background:rgba(10,15,44,.7);border:1px solid var(--line);border-radius:12px;padding:7px 10px;min-height:38px}
.ghostbtn{height:38px;padding:0 14px;border-radius:12px;border:1px solid var(--line);font-size:14px;color:var(--slate)}
.switch{display:inline-flex;align-items:center;gap:10px;font-size:15px}
.switch b{width:46px;height:28px;border-radius:14px;background:rgba(133,144,196,.3);position:relative;transition:background .2s}
.switch b::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:var(--ice);transition:left .2s}
.switch[aria-checked="true"] b{background:var(--aurora)}
.switch[aria-checked="true"] b::after{left:21px}
.actions{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.danger{color:var(--solar);font-size:15px;padding:10px 4px}
.primary{background:var(--ice);color:var(--void);border-radius:999px;padding:12px 24px;font-weight:600;font-size:15px}
#nowList{max-height:56vh;overflow:auto;margin:0 -6px}
.task{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:14px}
.task:hover{background:rgba(155,123,255,.1)}
.task .check{width:26px;height:26px;border-radius:50%;border:2px solid var(--slate);flex:none;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--void)}
.task.done .check{background:var(--aurora);border-color:var(--aurora)}
.task .t{flex:1;min-width:0;text-align:left}
.task .t b{display:block;font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task.done .t b{text-decoration:line-through;opacity:.55}
.task .t small{display:block;color:var(--slate);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task .p{width:26px;height:26px;border-radius:8px;font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center;color:var(--void);flex:none}
.due-soon{color:var(--gold)!important} .due-now{color:var(--solar)!important}
#nowEmpty{color:var(--slate);padding:18px 8px;font-size:15px}

/* radial menu */
#radial{position:fixed;inset:0;z-index:13;display:none;background:rgba(7,10,34,.5)}
#radial .focusring{position:absolute;border-radius:50%;border:2px dashed rgba(232,240,255,.7);pointer-events:none}
#radial.show{display:block}
#radial .rb{position:absolute;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-size:11.5px;color:var(--ice);gap:2px;transform:scale(.4);opacity:0;
  transition:transform .22s cubic-bezier(.2,.9,.3,1.3),opacity .18s}
#radial.show .rb{transform:scale(1);opacity:1}
#radial .rb span{font-size:19px;line-height:1}
#radial .rb.danger{color:var(--solar)}

/* toast + boot */
#toast{position:fixed;left:50%;transform:translate(-50%,20px);bottom:calc(env(safe-area-inset-bottom,0px) + 120px);z-index:15;
  border-radius:999px;padding:10px 10px 10px 18px;font-size:14px;display:flex;align-items:center;gap:12px;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;max-width:calc(100% - 24px)}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{color:var(--aurora);font-weight:600;padding:4px 10px}
#toast button:empty{display:none}
#boot{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--void);transition:opacity .6s}
#boot.gone{opacity:0;pointer-events:none}
#boot .core{width:84px;height:84px;border-radius:50%;border:2px solid var(--aurora);box-shadow:0 0 30px rgba(108,255,200,.5),inset 0 0 20px rgba(108,255,200,.3);
  animation:breathe 1.6s ease-in-out infinite}
#boot p{margin:0;color:var(--slate);font-size:15px;max-width:300px;text-align:center}
@keyframes breathe{50%{transform:scale(.88);box-shadow:0 0 14px rgba(108,255,200,.3),inset 0 0 10px rgba(108,255,200,.2)}}
#fileIn{position:fixed;left:-9999px;opacity:0;width:1px;height:1px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){.sheet,#radial .rb,#toast{transition:none}#boot .core{animation:none}}
@media (max-width:420px){.dockbtn.txt{padding:0 13px}}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<canvas id="scene" aria-label="Thought orbit. Use the jump bar or the keyboard to navigate."></canvas>

<header id="top">
  <div id="mark" aria-label="ORBIT"><i></i>RBIT</div>
  <button id="status" class="glass" aria-haspopup="true" aria-controls="filemenu"><b></b><span id="statusText">Not saved yet</span></button>
  <nav id="trail" aria-label="Path"></nav>
</header>

<div id="filemenu" class="glass" role="menu">
  <button data-f="save" role="menuitem">Save</button>
  <button data-f="saveas" role="menuitem">Save as a new file</button>
  <button data-f="open" role="menuitem">Open a file</button>
  <button data-f="new" role="menuitem">Start a new map</button>
  <button data-f="undo" role="menuitem">Undo last change</button>
  <small>Opens and saves the same .sqlite files as MINDGRID.</small>
</div>

<div id="info" aria-live="polite"></div>

<div id="dock">
  <div id="jumpWrap">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
    <input id="jump" class="glass" type="search" placeholder="Jump to a thought" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" aria-controls="results">
    <div id="results" class="glass" role="listbox"></div>
  </div>
  <button id="nowBtn" class="dockbtn txt glass" title="What needs doing">Now <em id="nowCount"></em></button>
  <button id="addBtn" class="dockbtn" title="Add a thought inside this one (Tab)" aria-label="Add a thought inside this one">+</button>
</div>

<section id="editor" class="sheet" aria-label="Edit thought">
  <div class="grab"></div>
  <textarea id="edText" placeholder="What’s the thought?" aria-label="Thought"></textarea>
  <div class="row"><span class="lbl">Priority</span>
    <button class="chip" data-p="A" title="Urgent and important">A</button>
    <button class="chip" data-p="B" title="Important, not urgent">B</button>
    <button class="chip" data-p="C" title="Urgent, not important">C</button>
    <button class="chip" data-p="D" title="Neither">D</button>
    <button class="chip" data-p="" title="No priority">none</button>
  </div>
  <div class="row"><label for="edDue">Due</label><input id="edDue" type="date"><button class="ghostbtn" id="edDueClear">Clear</button></div>
  <div class="row"><span class="lbl">Status</span><button class="switch" id="edDone" role="switch" aria-checked="false"><b></b><span>Done</span></button></div>
  <div class="actions"><button class="danger" id="edDelete">Delete thought</button><button class="primary" id="edClose">Done editing</button></div>
</section>

<section id="now" class="sheet" aria-label="Now">
  <div class="grab"></div>
  <h3>Now</h3>
  <div id="nowList"></div>
  <div class="actions"><span></span><button class="primary" id="nowClose">Close</button></div>
</section>

<div id="radial" role="menu"></div>
<div id="toast" class="glass" role="status"><span id="toastText"></span><button id="toastBtn"></button></div>
<div id="boot"><div class="core"></div><p id="bootText">Bringing your thoughts into orbit</p></div>
<input type="file" id="fileIn" tabindex="-1" aria-hidden="true">
<div class="sr" id="announce" aria-live="polite"></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const SQLJS = 'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/';
const SCHEMA = `
CREATE TABLE IF NOT EXISTS nodes(id INTEGER PRIMARY KEY, parent_id INTEGER, text TEXT NOT NULL DEFAULT '',
  x REAL NOT NULL DEFAULT 0, y REAL NOT NULL DEFAULT 0, collapsed INTEGER NOT NULL DEFAULT 0, width REAL, color TEXT,
  font_size REAL, done INTEGER NOT NULL DEFAULT 0, due TEXT, category TEXT, created_at TEXT, updated_at TEXT);
CREATE INDEX IF NOT EXISTS idx_nodes_parent ON nodes(parent_id);
CREATE TABLE IF NOT EXISTS meta(key TEXT PRIMARY KEY, value TEXT);`;
const PRI = { A: '#FF7A6B', B: '#FFD166', C: '#6CFFC8', D: '#8590C4' };
const PRI_NAME = { A: 'urgent and important', B: 'important', C: 'urgent', D: 'neither' };
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const now = () => new Date().toISOString();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ================= data ================= */
let SQL = null, db = null;
let nodes = new Map(), nextId = 1, version = 0;
let focusId = null;                 // null = all maps (only when there is more than one)
let fileName = 'orbit.sqlite', fileHandle = null, dirty = false, lastSaved = null;
const undoStack = [], redoStack = [];

function migrate(d) {
  const cols = (d.exec('PRAGMA table_info(nodes)')[0]?.values || []).map(r => r[1]);
  const add = { collapsed: 'INTEGER NOT NULL DEFAULT 0', width: 'REAL', color: 'TEXT', font_size: 'REAL',
    done: 'INTEGER NOT NULL DEFAULT 0', due: 'TEXT', category: 'TEXT', created_at: 'TEXT', updated_at: 'TEXT' };
  for (const [c, t] of Object.entries(add)) if (!cols.includes(c)) d.run(`ALTER TABLE nodes ADD COLUMN ${c} ${t}`);
}
let idxCache = null, idxVer = -1, descCache = new Map(), statCache = new Map();
function index() {
  if (idxVer === version) return idxCache;
  idxCache = new Map(); descCache = new Map(); statCache = new Map();
  for (const n of nodes.values()) {
    const p = nodes.has(n.parent) ? n.parent : null;
    if (!idxCache.has(p)) idxCache.set(p, []);
    idxCache.get(p).push(n);
  }
  for (const list of idxCache.values()) list.sort((a, b) => (a.y - b.y) || (a.id - b.id));
  idxVer = version; return idxCache;
}
const kids = id => index().get(id) || [];
const roots = () => kids(null);
const parentOf = n => (n && nodes.has(n.parent)) ? n.parent : null;
function descCount(id) {
  index(); if (descCache.has(id)) return descCache.get(id);
  let c = 0; for (const k of kids(id)) c += 1 + descCount(k.id);
  descCache.set(id, c); return c;
}
function leafStats(id) {            // how many tasks (leaves) below, and how many are done
  index(); if (statCache.has(id)) return statCache.get(id);
  const ks = kids(id); let s;
  if (!ks.length) { const n = nodes.get(id); s = { leaves: 1, done: n && n.done ? 1 : 0 }; }
  else { s = { leaves: 0, done: 0 }; for (const k of ks) { const t = leafStats(k.id); s.leaves += t.leaves; s.done += t.done; } }
  statCache.set(id, s); return s;
}
function pathTo(id) { const p = []; let c = nodes.get(id), g = 0; while (c && g++ < 9999) { p.unshift(c); c = nodes.get(parentOf(c)); } return p; }
const title = n => (n ? (n.text.split('\n')[0].trim() || 'Untitled') : mapName());
const mapName = () => fileName.replace(/\.(sqlite3?|db)$/i, '');
const short = (t, m = 24) => t.length > m ? t.slice(0, m - 1) + '…' : t;

function daysUntil(due) {
  const [y, m, d] = due.split('-').map(Number), t = new Date(); t.setHours(0, 0, 0, 0);
  return Math.round((new Date(y, m - 1, d) - t) / 86400000);
}
function dueText(due) {
  if (!due) return null;
  const k = daysUntil(due);
  if (k < 0) return { t: `${-k} day${k === -1 ? '' : 's'} overdue`, c: 'due-now', k };
  if (k === 0) return { t: 'due today', c: 'due-now', k };
  if (k === 1) return { t: 'due tomorrow', c: 'due-soon', k };
  const [y, m, d] = due.split('-').map(Number);
  const date = new Date(y, m - 1, d).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
  return { t: `due ${date}`, c: k <= 3 ? 'due-soon' : '', k };
}
function ago(iso) {
  const d = new Date(iso); if (!iso || isNaN(d)) return null;
  const m = Math.floor((Date.now() - d) / 60000);
  if (m < 1) return 'just now'; if (m < 60) return `${m} min ago`;
  const h = Math.floor(m / 60); if (h < 24) return `${h} h ago`;
  const days = Math.floor(h / 24); return days === 1 ? 'yesterday' : `${days} days ago`;
}

/* ================= changes, undo ================= */
const snap = () => JSON.stringify([...nodes.values()]);
function pushUndo() { undoStack.push(snap()); if (undoStack.length > 150) undoStack.shift(); redoStack.length = 0; }
function restore(s) {
  nodes = new Map(JSON.parse(s).map(n => [n.id, n]));
  nextId = Math.max(0, ...nodes.keys()) + 1;
  if (focusId != null && !nodes.has(focusId)) focusId = roots()[0]?.id ?? null;
  changed();
}
function undo() { if (!undoStack.length) return toast('Nothing to undo'); redoStack.push(snap()); restore(undoStack.pop()); toast('Undone'); }
function redo() { if (!redoStack.length) return; undoStack.push(snap()); restore(redoStack.pop()); }
function changed() { version++; dirty = true; build(); renderInfo(); renderTrail(); renderStatus(); renderNowCount(); scheduleCache(); if ($('#now').classList.contains('show')) renderNow(); }

function addChild(pid) {
  pushUndo();
  const p = nodes.get(pid), sibs = pid == null ? roots() : kids(pid), t = now(), id = nextId++;
  const x = p ? p.x + 260 : (roots().at(-1)?.x ?? 0), y = sibs.length ? Math.max(...sibs.map(s => s.y)) + (p ? 70 : 400) : (p ? p.y : 0);
  nodes.set(id, { id, parent: pid ?? null, text: '', x, y, collapsed: 0, width: null, color: p?.color ?? null, fs: null, done: 0, due: null, cat: null, created: t, updated: t });
  changed();
  return id;
}
function removeNode(id) {
  const n = nodes.get(id); if (!n) return;
  if (nodes.size === 1) return toast('A map needs at least one thought');
  pushUndo();
  const gone = [id]; for (let i = 0; i < gone.length; i++) for (const k of kids(gone[i])) gone.push(k.id);
  gone.forEach(i => nodes.delete(i));
  if (focusId != null && !nodes.has(focusId)) focusId = nodes.has(n.parent) ? n.parent : (roots().length > 1 ? null : roots()[0]?.id ?? null);
  changed();

/* editor */
let edId = null, edNew = false, edUndo = false, edTimer = 0;
function openEditor(id, isNew = false) {
  const n = nodes.get(id); if (!n) return;
  closeFloating(); $('#now').classList.remove('show');
  edId = id; edNew = isNew; edUndo = isNew;
  $('#edText').value = n.text; $('#edDue').value = n.due || '';
  markChips(n); $('#edDone').setAttribute('aria-checked', n.done ? 'true' : 'false');
  $('#edDelete').textContent = isNew ? 'Discard' : 'Delete thought';
  $('#editor').classList.add('show');
  const ta = $('#edText'); ta.focus({ preventScroll: true });
  if (!isNew) ta.setSelectionRange(ta.value.length, ta.value.length);
}
function edChange(fn) {
  const n = nodes.get(edId); if (!n) return;
  if (!edUndo) { pushUndo(); edUndo = true; }
  fn(n); n.updated = now(); changed();
}
function markChips(n) { document.querySelectorAll('#editor .chip').forEach(c => c.classList.toggle('on', (c.dataset.p || null) === (n.cat || null))); }
function closeEditor() {
  if (edId == null) return;
  clearTimeout(edTimer); flushText();
  const n = nodes.get(edId);
  $('#editor').classList.remove('show'); $('#edText').blur();
  if (n && edNew && !n.text.trim()) { nodes.delete(n.id); undoStack.pop(); changed(); }
  edId = null;
}
function flushText() { const n = nodes.get(edId); const v = $('#edText').value; if (n && v !== n.text) edChange(m => { m.text = v; }); }
$('#edText').addEventListener('input', () => { clearTimeout(edTimer); edTimer = setTimeout(flushText, 250); });
$('#edText').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); closeEditor(); } if (e.key === 'Escape') { e.preventDefault(); closeEditor(); } });
document.querySelectorAll('#editor .chip').forEach(c => c.addEventListener('click', () => edChange(n => { n.cat = c.dataset.p || null; markChips(n); })));
$('#edDue').addEventListener('change', e => edChange(n => { n.due = e.target.value || null; }));
$('#edDueClear').addEventListener('click', () => { $('#edDue').value = ''; edChange(n => { n.due = null; }); });
$('#edDone').addEventListener('click', () => edChange(n => { n.done = n.done ? 0 : 1; $('#edDone').setAttribute('aria-checked', n.done ? 'true' : 'false'); }));
$('#edDelete').addEventListener('click', () => {
  const id = edId, n = nodes.get(id), wasNew = edNew;
  $('#editor').classList.remove('show'); edId = null; clearTimeout(edTimer);
  if (wasNew) { nodes.delete(id); undoStack.pop(); changed(); return; }
  if (focusId === id) { const p = parentOf(n); focusId = p != null ? p : null; }
  removeNode(id);
});
$('#edClose').addEventListener('click', closeEditor);

/* now: what needs doing */
function tasks() {
  const list = [...nodes.values()].filter(n => (!kids(n.id).length || n.due || n.cat));
  const near = n => n.due && daysUntil(n.due) <= 3 ? daysUntil(n.due) : null;
  const rank = c => c ? 'ABCD'.indexOf(c) : 4;
  return list.sort((a, b) => {
    const da = near(a), db = near(b);
    if (da != null || db != null) { if (da == null) return 1; if (db == null) return -1; if (da !== db) return da - db; return rank(a.cat) - rank(b.cat); }
    const r = rank(a.cat) - rank(b.cat); if (r) return r;
    const ua = a.due ? daysUntil(a.due) : Infinity, ub = b.due ? daysUntil(b.due) : Infinity; if (ua !== ub) return ua < ub ? -1 : 1;
    return (b.created || '').localeCompare(a.created || '');
  });
}
function renderNowCount() {
  const c = [...nodes.values()].filter(n => !n.done && n.due && daysUntil(n.due) <= 1).length;   // overdue, today, tomorrow
  $('#nowCount').textContent = c ? String(c) : '';
}
function renderNow() {
  const open = tasks().filter(n => !n.done).slice(0, 40), doneN = [...nodes.values()].filter(n => n.done).length;
  const box = $('#nowList');
  if (!open.length) { box.innerHTML = `<div id="nowEmpty">Nothing waiting. Add thoughts with + and give them a due date or priority to see them here.</div>`; return; }
  box.innerHTML = open.map(n => {
    const d = dueText(n.due), p = pathTo(n.id).slice(0, -1).map(m => short(title(m), 16)).join(' / ');
    return `<div class="task" data-id="${n.id}">
      <button class="check" data-done="${n.id}" aria-label="Mark “${esc(title(n))}” done"></button>
      <button class="t" data-go="${n.id}"><b>${esc(title(n))}</b><small class="${d ? d.c : ''}">${d ? d.t : esc(p || 'top level')}</small></button>
      ${n.cat ? `<span class="p" style="background:${PRI[n.cat]}" title="${PRI_NAME[n.cat]}">${n.cat}</span>` : ''}
    </div>`;
  }).join('') + (doneN ? `<div id="nowEmpty">${doneN} done so far.</div>` : '');
}
$('#nowList').addEventListener('click', e => {
  const d = e.target.closest('[data-done]');
  if (d) { const n = nodes.get(+d.dataset.done); d.closest('.task').classList.add('done'); setTimeout(() => { setDone(n.id, true); toast(`Done: “${short(title(n))}”`, 'Undo', undo); }, 350); return; }
  const g = e.target.closest('[data-go]');
  if (g) { $('#now').classList.remove('show'); const n = nodes.get(+g.dataset.go); setFocus(kids(n.id).length ? n.id : parentOf(n) ?? n.id); if (kids(n.id).length === 0) setTimeout(() => openEditor(n.id), 380); }
});
$('#nowBtn').addEventListener('click', () => { closeFloating(); closeEditor(); renderNow(); $('#now').classList.toggle('show'); });
$('#nowClose').addEventListener('click', () => $('#now').classList.remove('show'));

/* jump bar */
const fold = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let jHits = [], jCur = 0;
function runJump() {
  const q = fold($('#jump').value.trim()), box = $('#results');
  if (!q) { box.classList.remove('show'); jHits = []; return; }
  const words = q.split(/\s+/);
  jHits = [...nodes.values()].filter(n => { const t = fold(n.text); return words.every(w => t.includes(w)); })
    .sort((a, b) => fold(title(a)).indexOf(words[0]) - fold(title(b)).indexOf(words[0]) || (b.updated || '').localeCompare(a.updated || '')).slice(0, 8);
  jCur = 0;
  box.innerHTML = jHits.length ? jHits.map((n, i) => {
    const t = esc(title(n)), p = pathTo(n.id).slice(0, -1).map(m => esc(short(title(m), 18))).join(' / ');
    return `<button data-i="${i}" class="${i === 0 ? 'cur' : ''}" role="option">${t}<small>${p || 'top level'}</small></button>`;
  }).join('') : `<div class="empty">No thought contains “${esc($('#jump').value.trim())}”.</div>`;
  box.classList.add('show');
}
function jumpTo(n) { if (!n) return; $('#jump').value = ''; $('#results').classList.remove('show'); $('#jump').blur(); setFocus(kids(n.id).length ? n.id : (parentOf(n) ?? n.id)); flashChild(n.id); }
function flashChild(id) { const it = items.find(i => i.id === id && i.role === 'child'); if (it) { hl = it.idx; kick(); } }
$('#jump').addEventListener('input', runJump);
$('#jump').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if (!jHits.length) return; jCur = (jCur + (e.key === 'ArrowDown' ? 1 : -1) + jHits.length) % jHits.length;
    document.querySelectorAll('#results button').forEach((b, i) => b.classList.toggle('cur', i === jCur)); }
  else if (e.key === 'Enter') { e.preventDefault(); jumpTo(jHits[jCur]); }
  else if (e.key === 'Escape') { $('#jump').value = ''; runJump(); $('#jump').blur(); }
});
$('#results').addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b) jumpTo(jHits[+b.dataset.i]); });

/* add button */
$('#addBtn').addEventListener('click', () => {
  if (focusId == null) { const id = addChild(null); openEditor(id, true); return; }
  openEditor(addChild(focusId), true);
});

/* keyboard */
document.addEventListener('keydown', e => {
  const k = e.key, mod = e.metaKey || e.ctrlKey;
  if (mod && k.toLowerCase() === 's') { e.preventDefault(); save(e.shiftKey); return; }
  if (mod && k.toLowerCase() === 'o') { e.preventDefault(); openFile(); return; }
  if (mod && k.toLowerCase() === 'k') { e.preventDefault(); $('#jump').focus(); return; }
  if (e.target.matches('input,textarea')) return;
  if (mod && k.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod) return;
  const ring = items.filter(i => i.role === 'child');
  if (k === '/') { e.preventDefault(); $('#jump').focus(); }
  else if (k === 'Tab') { e.preventDefault(); $('#addBtn').click(); }
  else if (k === 'ArrowRight' || k === 'ArrowDown') { e.preventDefault(); if (ring.length) { hl = (hl + 1) % ring.length; kick(); } }
  else if (k === 'ArrowLeft' || k === 'ArrowUp') { e.preventDefault(); if (ring.length) { hl = (hl - 1 + ring.length) % ring.length; kick(); } }
  else if (k === 'Enter') { e.preventDefault(); const t = ring.find(i => i.idx === hl); if (t) setFocus(t.id); else if (focusId != null) openEditor(focusId); }
  else if (k === 'Escape') { if ($('#radial.show,#filemenu.show')) closeFloating(); else if ($('#now.show')) $('#now').classList.remove('show'); else goUp(); }
  else if (k === 'Backspace') { e.preventDefault(); goUp(); }
  else if (k === ' ') { e.preventDefault(); if (focusId != null) openEditor(focusId); }
});

/* header, info, toast */
function renderTrail() {
  const t = $('#trail'); t.innerHTML = '';
  const path = focusId == null ? [] : pathTo(focusId);
  const parts = [];
  if (roots().length > 1) parts.push({ id: null, label: 'All maps' });
  path.forEach(n => parts.push({ id: n.id, label: short(title(n), 22) }));
  if (!parts.length) parts.push({ id: null, label: mapName() });
  const showFrom = Math.max(0, parts.length - 4);
  if (showFrom > 0) { const s = document.createElement('span'); s.className = 'sep'; s.textContent = '…'; t.appendChild(s); }
  parts.slice(showFrom).forEach((p, i, arr) => {
    if (i) { const s = document.createElement('span'); s.className = 'sep'; s.textContent = '/'; t.appendChild(s); }
    if (i === arr.length - 1) { const s = document.createElement('span'); s.className = 'here'; s.textContent = p.label; t.appendChild(s); }
    else { const b = document.createElement('button'); b.textContent = p.label; b.addEventListener('click', () => setFocus(p.id)); t.appendChild(b); }
  });
}
function renderInfo() {
  const box = $('#info'), n = focusId == null ? null : nodes.get(focusId);
  const pills = [];
  if (!n) { pills.push(`${roots().length} maps`); pills.push(`${nodes.size} thoughts`); }
  else {
    const c = descCount(n.id), st = leafStats(n.id);
    if (c) pills.push(`${c} inside`);
    if (c && st.leaves) pills.push(`${Math.round(100 * st.done / st.leaves)}% done`);
    const d = dueText(n.due); if (d && !n.done) pills.push([d.t, d.c]);
    if (n.cat) pills.push(`priority ${n.cat}`);
    if (n.done) pills.push('done');
    const u = ago(n.updated); if (u) pills.push(`updated ${u}`);
  }
  box.innerHTML = pills.map(p => Array.isArray(p) ? `<span class="${p[1]}">${esc(p[0])}</span>` : `<span>${esc(p)}</span>`).join('');
}
function renderStatus() {
  const s = $('#status'); s.classList.toggle('dirty', dirty);
  $('#statusText').textContent = dirty ? (lastSaved ? 'Unsaved changes' : 'Not saved yet') : (lastSaved ? `Saved ${ago(lastSaved)}` : 'Not saved yet');
}
setInterval(() => { renderStatus(); renderInfo(); }, 30000);
let toastTimer = 0;
function toast(msg, btn = '', fn = null) {
  $('#toastText').textContent = msg; const b = $('#toastBtn'); b.textContent = btn; b.onclick = fn ? () => { hideToast(); fn(); } : null;
  $('#toast').classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, btn ? 5000 : 2200);
}
function hideToast() { $('#toast').classList.remove('show'); }
function closeFloating() { closeRadial(); $('#filemenu').classList.remove('show'); $('#results').classList.remove('show'); }
$('#status').addEventListener('click', e => { e.stopPropagation(); $('#filemenu').classList.toggle('show'); });
$('#filemenu').addEventListener('click', e => {
  const b = e.target.closest('[data-f]'); if (!b) return; $('#filemenu').classList.remove('show');
  ({ save: () => save(false), saveas: () => save(true), open: openFile, new: newMap, undo })[b.dataset.f]();
});
document.addEventListener('pointerdown', e => { if (!e.target.closest('#filemenu,#status')) $('#filemenu').classList.remove('show'); if (!e.target.closest('#jumpWrap')) $('#results').classList.remove('show'); }, true);

/* ================= SQLite files ================= */
function writeDb() {
  db.run('BEGIN');
  try {
    db.run('DELETE FROM nodes');
    const st = db.prepare('INSERT INTO nodes(id,parent_id,text,x,y,collapsed,width,color,font_size,done,due,category,created_at,updated_at) VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?)');
    for (const n of nodes.values()) st.run([n.id, n.parent ?? null, n.text, n.x, n.y, n.collapsed ? 1 : 0, n.width ?? null, n.color ?? null, n.fs ?? null, n.done ? 1 : 0, n.due ?? null, n.cat ?? null, n.created ?? null, n.updated ?? null]);
    st.free();
    const up = db.prepare('INSERT OR REPLACE INTO meta(key,value) VALUES (?,?)');
    up.run(['orbit_focus', focusId == null ? '' : String(focusId)]); up.run(['saved_at', now()]); up.run(['file_saved_at', lastSaved ?? '']);
    if (!db.exec("SELECT 1 FROM meta WHERE key='app'").length) up.run(['app', 'orbit 1']);
    up.free();
    db.run('COMMIT');
  } catch (err) { db.run('ROLLBACK'); throw err; }
}
function loadBytes(bytes, name, opts = {}) {
  let d;
  try { d = new SQL.Database(bytes); d.run(SCHEMA); migrate(d); d.exec('SELECT id FROM nodes LIMIT 1'); }
  catch (err) { d?.close(); toast(`${name} is not a map file this app can read`); return false; }
  db?.close(); db = d; fileName = name || 'orbit.sqlite'; fileHandle = opts.handle ?? null;
  nodes = new Map();
  const res = db.exec('SELECT id,parent_id,text,x,y,collapsed,width,color,font_size,done,due,category,created_at,updated_at FROM nodes');
  if (res.length) for (const r of res[0].values) nodes.set(r[0], { id: r[0], parent: r[1], text: r[2] ?? '', x: r[3] ?? 0, y: r[4] ?? 0, collapsed: r[5] || 0,
    width: r[6], color: /^#[0-9a-f]{6}$/i.test(r[7] || '') ? r[7] : null, fs: r[8], done: r[9] ? 1 : 0,
    due: /^\d{4}-\d{2}-\d{2}$/.test(r[10] || '') ? r[10] : null, cat: /^[ABCD]$/.test(r[11] || '') ? r[11] : null, created: r[12], updated: r[13] });
  if (!nodes.size) { const t = now(); nodes.set(1, { id: 1, parent: null, text: 'New idea', x: 0, y: 0, collapsed: 0, width: null, color: null, fs: null, done: 0, due: null, cat: null, created: t, updated: t }); }
  nextId = Math.max(0, ...nodes.keys()) + 1;
  const meta = Object.fromEntries(db.exec('SELECT key,value FROM meta')[0]?.values || []);
  lastSaved = meta.file_saved_at || null;
  version++; undoStack.length = redoStack.length = 0; anim.clear();
  const f = +meta.orbit_focus;
  focusId = nodes.has(f) ? f : (roots().length > 1 ? null : roots()[0].id);
  dirty = !!opts.dirty; build(); renderInfo(); renderTrail(); renderStatus(); renderNowCount();
  if (!opts.quiet) toast(`Opened ${fileName}: ${nodes.size} thoughts`);
  if (!opts.fromCache) cacheNow();
  return true;
}
function newMap() {
  if (dirty && !confirm('Start a new map? Changes that are not saved to a file will be lost.')) return;
  db?.close(); db = new SQL.Database(); db.run(SCHEMA);
  const t = now();
  nodes = new Map([[1, { id: 1, parent: null, text: 'New idea', x: 0, y: 0, collapsed: 0, width: null, color: null, fs: null, done: 0, due: null, cat: null, created: t, updated: t }]]);
  nextId = 2; fileName = 'orbit.sqlite'; fileHandle = null; lastSaved = null; focusId = 1;
  version++; undoStack.length = redoStack.length = 0; anim.clear(); dirty = false;
  build(); renderInfo(); renderTrail(); renderStatus(); renderNowCount(); cacheNow();
}
const types = [{ description: 'Map file (SQLite)', accept: { 'application/x-sqlite3': ['.sqlite', '.sqlite3', '.db'] } }];
async function save(as = false) {
  if (edId != null) flushText();
  const prev = lastSaved; lastSaved = now();
  try { writeDb(); } catch (err) { lastSaved = prev; return toast('Could not save: ' + err.message); }
  const data = db.export();
  if (window.showSaveFilePicker) {
    try {
      if (!fileHandle || as) { fileHandle = await showSaveFilePicker({ suggestedName: fileName, types }); fileName = fileHandle.name; }
      else if (fileHandle.queryPermission && await fileHandle.queryPermission({ mode: 'readwrite' }) !== 'granted') await fileHandle.requestPermission({ mode: 'readwrite' });
      const w = await fileHandle.createWritable(); await w.write(data); await w.close();
      dirty = false; renderStatus(); renderTrail(); cacheNow(); return toast(`Saved ${fileName}`);
    } catch (err) { if (err.name === 'AbortError') { lastSaved = prev; renderStatus(); return; } fileHandle = null; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], { type: 'application/x-sqlite3' })); a.download = fileName;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  dirty = false; renderStatus(); cacheNow(); toast(`Downloaded ${fileName}`);
}
function openFile() {
  if (window.showOpenFilePicker) {
    showOpenFilePicker({ types }).then(async ([h]) => readFile(await h.getFile(), h)).catch(err => { if (err.name !== 'AbortError') $('#fileIn').click(); });
    return;
  }
  $('#fileIn').click();
}
async function readFile(f, handle = null) {
  if (dirty && !confirm(`Open ${f.name}? Changes that are not saved to a file will be lost.`)) return;
  const bytes = new Uint8Array(await f.arrayBuffer());
  if (new TextDecoder().decode(bytes.slice(0, 15)) !== 'SQLite format 3') return toast(`${f.name} is not a SQLite map file`);
  loadBytes(bytes, f.name, { handle });
}
$('#fileIn').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) readFile(f); });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) readFile(f); });
addEventListener('beforeunload', e => { if (dirty) { cacheNow(); e.preventDefault(); e.returnValue = ''; } });

/* browser cache so nothing is lost between visits */
const IDB = {
  open() { return new Promise((res, rej) => { const r = indexedDB.open('orbit', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async set(k, v) { const d = await this.open(); return new Promise((res, rej) => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); },
  async get(k) { const d = await this.open(); return new Promise((res, rej) => { const r = d.transaction('kv').objectStore('kv').get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
};
let cacheTimer = 0;
function scheduleCache() { clearTimeout(cacheTimer); cacheTimer = setTimeout(cacheNow, 700); }
async function cacheNow() {
  if (!db) return;
  try { writeDb(); const rec = { bytes: db.export(), name: fileName, dirty, lastSaved };
    try { await IDB.set('session', { ...rec, handle: fileHandle }); } catch { await IDB.set('session', rec); } } catch {}
}

/* ================= start ================= */
addEventListener('resize', () => { resize(); renderInfo(); });
document.fonts?.ready.then(() => kick());
(async function boot() {
  resize();
  try {
    if (typeof initSqlJs !== 'function') throw new Error('sql.js did not load');
    SQL = await initSqlJs({ locateFile: f => SQLJS + f });
  } catch (err) {
    $('#bootText').textContent = 'The map engine could not load. It comes from cdnjs.cloudflare.com, so check your connection and reload.';
    return;
  }
  let ok = false;
  try { const s = await IDB.get('session'); if (s?.bytes) ok = loadBytes(new Uint8Array(s.bytes), s.name, { quiet: true, fromCache: true, dirty: s.dirty, handle: s.handle }); } catch {}
  if (!ok) newMap();
  $('#boot').classList.add('gone');
  if (!ok) setTimeout(() => toast('Tap the core to write your first thought, then + to add more'), 700);
})();
})();
</script>
</body>
